# Builds and tests this fork: the Windows runtime and launcher with MSVC (what a Linux PC cannot
# build), and the Linux server and the tests that run there. The Windows build is kept as an
# artifact to try in the game. Local-build settings: no auto-update, so a build from here never
# replaces itself with an official release (cmake/Apps.cmake, DINGOSDK_LAUNCHER_AUTO_UPDATE).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure
        run: >
          cmake --preset linux-x64
          -DDINGOSDK_BUILD_MOD_PERF_TESTS=ON
          -DDINGOSDK_BUILD_PLUGIN_TESTS=ON
          -DDINGOSDK_BUILD_REPLAY_KEYFRAMES_TESTS=ON
          -DDINGOSDK_BUILD_ANIMATION_STUDIO_TESTS=ON
      - name: Build
        run: cmake --build build/linux --parallel 4
      - name: Test
        run: ctest --test-dir build/linux --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake --preset vs2022-x64
          -DDINGOSDK_BUILD_MOD_PERF_TESTS=ON
          -DDINGOSDK_BUILD_LAUNCHER_TESTS=ON
          -DDINGOSDK_BUILD_PLUGIN_TESTS=ON
      - name: Build
        run: cmake --build --preset release --parallel 4
      - name: Test
        run: ctest --test-dir build/vs2022-x64 -C Release --output-on-failure
      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reskate-windows-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/vs2022-x64/Release/ReSkate.dll
            build/vs2022-x64/Release/ReSkateLauncher.exe
            build/vs2022-x64/Release/*.pdb
